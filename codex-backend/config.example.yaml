config-version: 8
server:
  host: "127.0.0.1"
  port: 18418
management:
  allow-remote: false
  disable-control-panel: true
  disable-auto-update-panel: true
access:
  api-keys: ["__CLIENT_KEYS__"]
oauth:
  auth-dir: "/root/.config/codex-model-proxy/auths"
routing:
  session-affinity: true
  retry:
    request-retry: 3
    max-retry-interval: 30
requests:
  tls-handshake-timeout-seconds: 20
  nonstream-keepalive-interval: 10
  streaming:
    keepalive-seconds: 15
    bootstrap-retries: 2
  payload:
    override:
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
        params:
          "reasoning.effort": "high"
observability:
  logs:
    debug: false
    logging-to-file: false
