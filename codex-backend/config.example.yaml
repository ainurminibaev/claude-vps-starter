config-version: 8
server:
  host: "127.0.0.1"
  port: 18418
management:
  allow-remote: false
  disable-control-panel: true
  disable-auto-update-panel: true
access:
  api-keys: ["__CLIENT_KEYS__"]
oauth:
  auth-dir: "/root/.config/codex-model-proxy/auths"
routing:
  session-affinity: true
  retry:
    request-retry: 3
    max-retry-interval: 30
multimedia:
  # Preserve requested image tools and image endpoints; do not inject tools into text/code requests.
  disable-image-generation: "passthrough"
upstream:
  codex:
    upstream-request-compression: true
    upstream-request-compression-min-bytes: 1024
requests:
  tls-handshake-timeout-seconds: 20
  nonstream-keepalive-interval: 10
  streaming:
    keepalive-seconds: 15
    bootstrap-retries: 2
  payload:
    override:
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
        params:
          "reasoning.effort": "high"
      # Native Auto Mode stage one; main work and stage two keep High.
      # Unknown classifier envelopes fall back to High automatically.
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
            from-protocol: "claude"
            match:
              - "input.#": 2
                "input.0.role": "developer"
                "input.1.role": "user"
                "input.1.content.0.text": "<transcript>\n"
            exist:
              - 'input.1.content.#(text%"*Stage 1 does NOT apply user intent or ALLOW exceptions*").text'
            not-exist:
              - "tools.0"
        params:
          "reasoning.effort": "medium"
observability:
  logs:
    debug: false
    logging-to-file: false
