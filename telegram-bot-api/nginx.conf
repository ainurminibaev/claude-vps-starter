server {
    listen 80;
    client_max_body_size 2000m;

    # Файлы: /file/bot<token>/<подпапка>/<имя> → /var/lib/telegram-bot-api/<token>/<подпапка>/<имя>.
    # Токен в ссылке — та же защита, что у api.telegram.org. Служебные binlog'и не отдаём.
    location ~ "^/file/bot([0-9]+:[A-Za-z0-9_-]+)/((documents|music|videos|voice|photos|video_notes|animations|stickers|thumbnails|temp)/[^/]+)$" {
        alias /var/lib/telegram-bot-api/$1/$2;
    }
    location /file/ {
        return 404;
    }

    location / {
        proxy_pass http://bot-api:8081;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
